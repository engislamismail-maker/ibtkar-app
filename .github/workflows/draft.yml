name: Build DRAFT Android APK

# نسخة تجريبية منفصلة: بتتبني من draft/index.html، اسمها "إبتكار تجريبي"، بتتثبت جنب التطبيق الأصلي
# (applicationId مختلف) وبتحفظ بياناتها في مكان منفصل على السيرفر — مبتلمسش البرنامج الأصلي.
# التنزيل: .../releases/download/android-draft/ibtkar-draft.apk
on:
  push:
    branches: [claude/android-shared-data-app-t7j758]
    paths:
      - draft/**
      - .github/workflows/draft.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-draft
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Use the draft app instead of the real one (only inside this build)
        run: |
          cp draft/index.html index.html
          cp draft/portal.html portal.html 2>/dev/null || true
          cp draft/android/*.java android/app/src/main/java/com/ibtkar/app/
          cp draft/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          [ -d draft/android/res ] && cp -r draft/android/res/. android/app/src/main/res/
          sed -i "s/applicationId 'com.ibtkar.app'/applicationId 'com.ibtkar.app.draft'/" android/app/build.gradle
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">إبتكار تجريبي</string>#' android/app/src/main/res/values/strings.xml
          grep -q "com.ibtkar.app.draft" android/app/build.gradle

      - name: Prepare web assets
        run: |
          ./android/scripts/prepare-web.sh
          ./draft/vendor-three.sh android/app/src/main/assets/www

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ibtkar-draft.apk

      - name: Publish to "android-draft" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-draft --yes --cleanup-tag || true
          gh release create android-draft ibtkar-draft.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "إبتكار تجريبي — نسخة ${{ github.run_number }}" \
            --notes "نسخة تجريبية منفصلة عن البرنامج الأصلي: بتتثبت جنبه وبياناتها لوحدها."

  # نسخة الكمبيوتر من التجريبي (ويندوز) — بتتثبت جنب برنامج الكمبيوتر الأصلي ("Ibtkar Draft")
  desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Draft web assets for desktop
        run: |
          cp draft/index.html index.html
          ./android/scripts/prepare-web.sh "$GITHUB_WORKSPACE/desktop-www"
          ./draft/vendor-three.sh "$GITHUB_WORKSPACE/desktop-www"
      - uses: actions/upload-artifact@v4
        with:
          name: draft-desktop-www
          path: desktop-www

  desktop-windows:
    needs: desktop-web
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: draft-desktop-www
          path: desktop/www
      - name: Make it a separate draft app
        working-directory: desktop
        run: |
          node -e "
            const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name='ibtkar-desktop-draft'; p.productName='Ibtkar Draft'; p.description='إبتكار — نسخة تجريبية للكمبيوتر';
            p.build.appId='com.ibtkar.app.draft'; p.build.productName='Ibtkar Draft';
            p.build.nsis.shortcutName='Ibtkar Draft'; p.build.nsis.artifactName='ibtkar-draft-setup.exe';
            fs.writeFileSync('package.json', JSON.stringify(p,null,2));"
          sed -i "s/title: 'إبتكار'/title: 'إبتكار تجريبي'/" main.js
      - name: Build installer
        working-directory: desktop
        run: |
          mkdir -p build && cp ../icon-512.png build/icon.png
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version
          npm install --no-audit --no-fund
          npm run dist
      - name: Publish to "desktop-draft" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-draft --yes --cleanup-tag || true
          gh release create desktop-draft desktop/dist/ibtkar-draft-setup.exe \
            --target "$GITHUB_SHA" --prerelease \
            --title "إبتكار تجريبي — الكمبيوتر (نسخة ${{ github.run_number }})" \
            --notes "نسخة تجريبية للكمبيوتر — بتتثبت جنب البرنامج الأصلي وبياناتها لوحدها."
